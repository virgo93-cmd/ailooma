<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Tutorial workflow</title><desc id="desc">A repeatable tutorial flow from prerequisites through execution, validation, and recovery.</desc><rect width="1200" height="675" rx="32" fill="#f8fafc"/><text x="70" y="92" fill="#0f172a" font-family="Arial,sans-serif" font-size="42" font-weight="700">Tutorial Workflow</text><text x="70" y="132" fill="#475569" font-family="Arial,sans-serif" font-size="22">A repeatable path from setup to a verified result</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="250" width="220" height="150" rx="22" fill="#dbeafe"/><text x="180" y="310" fill="#1e3a8a" font-size="25" font-weight="700">Prepare</text><text x="180" y="348" fill="#1e40af" font-size="17">versions &amp; inputs</text><rect x="345" y="250" width="220" height="150" rx="22" fill="#ede9fe"/><text x="455" y="310" fill="#4c1d95" font-size="25" font-weight="700">Execute</text><text x="455" y="348" fill="#5b21b6" font-size="17">small first run</text><rect x="620" y="250" width="220" height="150" rx="22" fill="#dcfce7"/><text x="730" y="310" fill="#14532d" font-size="25" font-weight="700">Validate</text><text x="730" y="348" fill="#166534" font-size="17">check expected output</text><rect x="895" y="250" width="220" height="150" rx="22" fill="#fef3c7"/><text x="1005" y="310" fill="#78350f" font-size="25" font-weight="700">Recover</text><text x="1005" y="348" fill="#92400e" font-size="17">log &amp; rollback</text></g><g stroke="#64748b" stroke-width="7" stroke-linecap="round"><path d="M295 325h40M570 325h40M845 325h40"/></g><text x="600" y="520" fill="#334155" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">A good tutorial explains not only success, but also failure and recovery.</text></svg>
