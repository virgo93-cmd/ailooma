<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI decision loop</title><desc id="desc">A practical loop for defining a task, testing an AI output, reviewing evidence, and improving the workflow.</desc><rect width="1200" height="675" rx="32" fill="#111827"/><text x="70" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">AI Decision Loop</text><text x="70" y="132" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="22">Define • Test • Verify • Improve</text><g font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle"><circle cx="260" cy="330" r="112" fill="#4f46e5"/><text x="260" y="322" fill="#fff">1. Define</text><text x="260" y="354" fill="#c7d2fe" font-size="17" font-weight="400">goal &amp; limits</text><circle cx="600" cy="330" r="112" fill="#0ea5e9"/><text x="600" y="322" fill="#fff">2. Test</text><text x="600" y="354" fill="#dbeafe" font-size="17" font-weight="400">real examples</text><circle cx="940" cy="330" r="112" fill="#10b981"/><text x="940" y="322" fill="#fff">3. Verify</text><text x="940" y="354" fill="#d1fae5" font-size="17" font-weight="400">sources &amp; risk</text></g><path d="M372 330h112M712 330h112" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/><path d="M940 455C800 600 400 600 260 455" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/><text x="600" y="585" fill="#fde68a" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">4. Improve the workflow, then repeat</text></svg>
