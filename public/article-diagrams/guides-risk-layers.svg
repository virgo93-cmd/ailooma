<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Guides risk layers</title><desc id="desc">A layered guide showing prevention, detection, recovery, and human review.</desc><rect width="1200" height="675" rx="32" fill="#111827"/><text x="70" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Guides: Layered Risk Control</text><text x="70" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="22">Prevent • detect • recover • review</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="180" y="205" width="840" height="75" rx="16" fill="#1d4ed8"/><text x="600" y="253" fill="#dbeafe" font-size="25" font-weight="700">Prevention — safer defaults and least privilege</text><rect x="250" y="305" width="700" height="75" rx="16" fill="#0891b2"/><text x="600" y="353" fill="#cffafe" font-size="25" font-weight="700">Detection — logs, alerts, and checks</text><rect x="320" y="405" width="560" height="75" rx="16" fill="#16a34a"/><text x="600" y="453" fill="#dcfce7" font-size="25" font-weight="700">Recovery — tested backup and rollback</text><rect x="390" y="505" width="420" height="75" rx="16" fill="#f59e0b"/><text x="600" y="553" fill="#451a03" font-size="25" font-weight="700">Human review</text></g></svg>
