<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Tools automation flow</title><desc id="desc">An automation flow from trigger to validation, action, and human review.</desc><rect width="1200" height="675" rx="32" fill="#ecfeff"/><text x="70" y="92" fill="#164e63" font-family="Arial,sans-serif" font-size="42" font-weight="700">Tools Automation Flow</text><text x="70" y="132" fill="#0e7490" font-family="Arial,sans-serif" font-size="22">Trigger → validate → act → review</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="80" y="260" width="210" height="135" rx="22" fill="#cffafe"/><text x="185" y="315" fill="#155e75" font-size="25" font-weight="700">Trigger</text><text x="185" y="350" fill="#0e7490" font-size="17">new input</text><rect x="345" y="260" width="210" height="135" rx="22" fill="#bfdbfe"/><text x="450" y="315" fill="#1e3a8a" font-size="25" font-weight="700">Validate</text><text x="450" y="350" fill="#1d4ed8" font-size="17">required fields</text><rect x="610" y="260" width="210" height="135" rx="22" fill="#d9f99d"/><text x="715" y="315" fill="#365314" font-size="25" font-weight="700">Act</text><text x="715" y="350" fill="#4d7c0f" font-size="17">safe operation</text><rect x="875" y="260" width="245" height="135" rx="22" fill="#fde68a"/><text x="997" y="315" fill="#78350f" font-size="25" font-weight="700">Human review</text><text x="997" y="350" fill="#92400e" font-size="17">exceptions &amp; rollback</text></g><g stroke="#0891b2" stroke-width="7" stroke-linecap="round"><path d="M295 328h40M560 328h40M825 328h50"/></g><text x="600" y="525" fill="#155e75" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">The safest automation makes errors visible instead of silently hiding them.</text></svg>
