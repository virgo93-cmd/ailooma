<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Software choice matrix</title><desc id="desc">A software selection matrix comparing workflow fit, privacy, portability, and total cost.</desc><rect width="1200" height="675" rx="32" fill="#0f172a"/><text x="70" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Software Choice Matrix</text><text x="70" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="22">Compare the workflow, not just the feature list</text><g font-family="Arial,sans-serif" font-size="23"><rect x="150" y="215" width="900" height="300" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3"/><path d="M150 290h900M150 365h900M150 440h900M375 215v300M600 215v300M825 215v300" stroke="#475569" stroke-width="2"/><text x="262" y="263" fill="#e2e8f0" text-anchor="middle" font-weight="700">Tool</text><text x="487" y="263" fill="#e2e8f0" text-anchor="middle" font-weight="700">Workflow fit</text><text x="712" y="263" fill="#e2e8f0" text-anchor="middle" font-weight="700">Privacy</text><text x="937" y="263" fill="#e2e8f0" text-anchor="middle" font-weight="700">Cost &amp; exit</text><text x="262" y="338" fill="#93c5fd" text-anchor="middle">Option A</text><text x="487" y="338" fill="#86efac" text-anchor="middle">High</text><text x="712" y="338" fill="#fde68a" text-anchor="middle">Review</text><text x="937" y="338" fill="#fca5a5" text-anchor="middle">Medium</text><text x="262" y="413" fill="#93c5fd" text-anchor="middle">Option B</text><text x="487" y="413" fill="#fde68a" text-anchor="middle">Medium</text><text x="712" y="413" fill="#86efac" text-anchor="middle">High</text><text x="937" y="413" fill="#86efac" text-anchor="middle">Low</text><text x="262" y="488" fill="#93c5fd" text-anchor="middle">Option C</text><text x="487" y="488" fill="#fca5a5" text-anchor="middle">Low</text><text x="712" y="488" fill="#fde68a" text-anchor="middle">Review</text><text x="937" y="488" fill="#fde68a" text-anchor="middle">High</text></g><text x="600" y="590" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">Choose the best fit for your constraints, data, and exit plan.</text></svg>
